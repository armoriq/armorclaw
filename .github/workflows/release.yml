name: Release

# A release is cut by changing the version in package.json on main. workflow_dispatch re-runs
# the same path, which is how a run that failed part way is retried: every step below is safe to
# repeat, and a version counts as released only once it is on npm. Tagging, the GitHub
# release and the npm publish live in one workflow because a release created with GITHUB_TOKEN
# does not trigger other workflows.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The OpenClaw version install-armorclaw.sh pins.
  OPENCLAW_VERSION: 2026.7.1

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # npm is what installed plugins update from, so a version already there is released even
      # when its tag or GitHub release is missing (2026.8.5 and earlier were published by hand).
      - name: Read the version and look for an existing release
        id: read
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          released=false
          if npm view "@armoriq/armorclaw@$version" version 2>/dev/null | grep -qx "$version"; then released=true; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          # Maintenance lines publish under an openclaw-<line> dist-tag so a user on that
          # OpenClaw LTS can install a compatible build. A prerelease goes to next, since latest
          # is what every installed plugin updates to. YYYY.M.P-N is an OpenClaw stable
          # correction, not a prerelease.
          case "$version" in
            2026.6.*) tag=openclaw-2026.6 ;;
            2026.2.*) tag=openclaw-2026.2 ;;
            *-*[!0-9]*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$released" = true ]; then
            echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --no-save "openclaw@${OPENCLAW_VERSION}"

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          npm pack --json > pack.json
          # shellcheck disable=SC2016  # the $ expressions below are JavaScript, not shell
          node -e '
            const [pack] = require("./pack.json");
            for (const want of ["dist/index.js", "dist/src/auto-update.js", "openclaw.plugin.json"]) {
              if (!pack.files.some((f) => f.path === want)) {
                console.error(`${want} missing from the package`);
                process.exit(1);
              }
            }
            if (pack.version !== process.env.VERSION) {
              console.error(`packed ${pack.version}, expected ${process.env.VERSION}`);
              process.exit(1);
            }
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${pack.filename}\n`);
          '

      # The tag is immutable: created once and never moved. A tag left by a failed run is reused
      # only when it already points at this commit.
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            tagged=$(git rev-parse "v$VERSION^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "tag v$VERSION points at $tagged, not $GITHUB_SHA; refusing to move it"
              exit 1
            fi
            echo "tag v$VERSION already points at this commit; reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists"
            exit 0
          fi
          prerelease=()
          if [ "$DIST_TAG" = next ]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" "$TARBALL" "${prerelease[@]}" \
            --title "v$VERSION" --verify-tag --generate-notes

      # Installed plugins update from the npm dist-tag, so this is the step that reaches users.
      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
