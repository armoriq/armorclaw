name: Test

on:
  push:
    branches: [main, v2026.2, v2026.6]
  pull_request:
    branches: [main, v2026.2, v2026.6]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenClaw 2026.6.34 needs Node >=22.19 and 2026.7.1 (the installer's pin) >=22.22.3,
        # so Node 20 could never install them. OpenClaw >=2026.9 drops the openclaw/plugin-sdk
        # entry this plugin imports, so it is not in the matrix until the plugin moves off it.
        node-version: [22]
        openclaw-version: ['2026.6.34', '2026.7.1']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # One install with the pin, because a plain install resolves openclaw to the newest
      # release, whose preinstall refuses Node 22.
      - name: Install dependencies with OpenClaw pinned for this matrix cell
        run: npm install --no-save "openclaw@${{ matrix.openclaw-version }}"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
